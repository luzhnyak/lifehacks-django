name: Django Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3022
          envs: DEPLOY_SHA
          script: |
            set -e
            APP_DIR="/home/lifehacks/htdocs/lifehacks.in.ua"
            REPO_URL="git@github.com:luzhnyak/lifehacks-django.git"

            cd "$APP_DIR"

            # Share this environment file with the process manager.
            # Fail before changing the checkout if production is unconfigured.
            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            fi
            : "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server environment}"
            : "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the server environment}"
            export DJANGO_DEBUG=false

            if [ ! -d ".git" ]; then
              git init
              git remote add origin $REPO_URL
            fi

            git fetch origin
            # Test jobs may finish out of order; never deploy a superseded push.
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "Skipping a superseded deployment."
              exit 0
            fi
            git reset --hard "$DEPLOY_SHA"

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py check --deploy
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo -n supervisorctl restart lifehacks.in.ua
